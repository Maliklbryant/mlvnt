<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="MLVNT — Personal training by Malik Bryant. Strength, physique, and performance coaching in New York. Time Moves. So Should You."
    />

    <meta name="theme-color" content="#1C1E22" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MLVNT" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icon-512.png"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="MLVNT — Personal Training"
    />

    <meta
      property="og:description"
      content="Personalized strength and physique training. Time Moves. So Should You."
    />

    <meta property="og:image" content="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <title>MLVNT — Personal Training</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0b0d;
        overflow-x: hidden;
      }

      * {
        box-sizing: border-box;
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
